spring.application.name=mail-service
server.port=8080
#### Encoding ####
server.tomcat.uri-encoding=UTF-8
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
logging.charset.console=UTF-8
logging.charset.file=UTF-8

#### MySQL ####
spring.datasource.url=jdbc:mysql://localhost:3306/mail-service?useUnicode=yes&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=root

#### Spring Data JPA ####
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#### Mail ####
# \u8A2D\u5B9A\u90F5\u4EF6\u670D\u52D9\u7684 SMTP \u670D\u52D9\u5668\u3002
spring.mail.host=localhost
# \u8A2D\u5B9A\u90F5\u4EF6\u670D\u52D9\u7684 SMTP \u670D\u52D9\u5668\u7AEF\u53E3\u3002
spring.mail.port=1025
# \u8A2D\u5B9A\u90F5\u4EF6\u670D\u52D9\u7684\u7528\u6236\u540D\u3002
spring.mail.username=''
# \u8A2D\u5B9A\u90F5\u4EF6\u670D\u52D9\u7684\u5BC6\u78BC\u3002
spring.mail.password=''
# \u5728\u90F5\u4EF6\u50B3\u8F38\u904E\u7A0B\u4E2D\u4F7F\u7528 TLS\uFF08Transport Layer Security\uFF09\u52A0\u5BC6\u5354\u8B70\uFF0C\u5F9E\u800C\u63D0\u9AD8\u90F5\u4EF6\u7684\u5B89\u5168\u6027\uFF0C\u7531\u65BC\u6B64\u8655\u70BA\u6E2C\u8A66\u6545\u95DC\u9589
spring.mail.properties.mail.smtp.auth=false
# \u8A2D\u5B9A\u90F5\u4EF6\u670D\u52D9\u7684 SMTP \u8EAB\u4EFD\u9A57\u8B49\uFF0C\u7531\u65BC\u6B64\u8655\u70BA\u6E2C\u8A66\u6545\u95DC\u9589\u3002
spring.mail.properties.mail.smtp.starttls.enable=false
# \u767C\u9001\u90F5\u4EF6\u6642\u7B49\u5F85\u5BEB\u5165\u64CD\u4F5C\u5B8C\u6210\u7684\u6700\u5927\u6642\u9593\uFF08\u6BEB\u79D2\uFF09\u3002
spring.mail.properties.mail.smtp.writetimeout=5000


#### Quartz ####


#### kafka ####
# \u544A\u8A34\u61C9\u7528\u7A0B\u5F0F\u61C9\u8A72\u9023\u63A5\u5230\u54EA\u4E00\u500B\u6216\u54EA\u5E7E\u500B Kafka broker \u4F86\u767C\u9001\u548C\u63A5\u6536\u6D88\u606F
spring.kafka.bootstrap-servers=localhost:9092


## Producer \u914D\u7F6E
# \u767C\u751F\u932F\u8AA4\uFF0C\u91CD\u9001\u6B21\u6578
spring.kafka.producer.retries=5 
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1

## Consumer \u914D\u7F6E
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=group.mail
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.session.timeout.ms=15000

## Listener \u914D\u7F6E
spring.kafka.listener.concurrency=5
#spring.kafka.listener.ack-mode=manual-immediate
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.ack-mode=record
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka.listener.KafkaMessageListenerContainer=DEBUG

# MailSendRequestedEvent \u5C0D\u61C9\u7684\u76EE\u7684\u5730
messaging.topics.send-mail=topic.send-mail
messaging.consumer-group.send-mail=group.send-mail
messaging.topics.send-mail.dlt=topic.send-mail.DLT
messaging.consumer-group.send-mail.dlt=group.send-mail.DLT

### \u4E8B\u4EF6\u985E\u6240\u5728\u8DEF\u5F91
event.package.path=com.example.demo.infra.event.shared.event
