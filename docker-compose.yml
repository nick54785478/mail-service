services:
  # MySQL 資料庫 (對應 spring.datasource)
  mysql:
    image: mysql:8.0
    container_name: mail-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sendmail
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Mailpit - 輕量級 SMTP 測試服務 (對應 spring.mail)
  mailpit:
    image: axllent/mailpit
    container_name: mail-service-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  # Kafka (KRaft 模式，無 Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: mail-service-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      
      # 分隔內部(INTERNAL)與外部(EXTERNAL)網路，外部給本機 Spring Boot 連，內部給 Docker 的 kafka-ui 連
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 97i8nGvERXWhKECk2tnZbQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Kafka UI 視覺化管理介面
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mail-service-kafka-ui
    ports:
      - "8028:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft-cluster
      # 使用上面配置的 INTERNAL listener
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

volumes:
  mysql-data:
  kafka-data:
